name: Build TeknoParrotUI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: |
        nuget restore TeknoParrotUI.sln
        dotnet restore TeknoParrotUI.sln

    - name: Build solution
      run: msbuild TeknoParrotUI.sln /p:Configuration=Release /m

    - name: Copy full build output
      shell: cmd
      run: |
        mkdir full_build
        xcopy /E /I /Y "TeknoParrotUI\bin\x86\Release\*" full_build\

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeknoParrotUI-Full-Build
        path: full_build/
        if-no-files-found: error
