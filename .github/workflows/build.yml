name: Build TeknoParrotUI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: |
        nuget restore TeknoParrotUI.sln
        dotnet restore TeknoParrotUI.sln

    - name: Build solution
      run: msbuild TeknoParrotUI.sln /p:Configuration=Release /m

    - name: Find correct Release folder and copy
      shell: pwsh
      run: |
        $releaseFolder = Get-ChildItem -Path . -Recurse -Directory | Where-Object { $_.FullName -match 'bin\\x86\\Release$' } | Select-Object -First 1
        if ($releaseFolder) {
          Write-Host "Found Release folder at: $($releaseFolder.FullName)"
          New-Item -ItemType Directory -Force -Path full_build
          Copy-Item -Path "$($releaseFolder.FullName)\*" -Destination full_build -Recurse -Force
          Write-Host "Files copied successfully"
          Get-ChildItem full_build
        } else {
          Write-Host "Release folder not found!"
          exit 1
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeknoParrotUI-Full-Build
        path: full_build/
        if-no-files-found: error
