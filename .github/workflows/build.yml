name: Build TeknoParrotUI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: |
        nuget restore TeknoParrotUI.sln
        dotnet restore TeknoParrotUI.sln

    - name: Build solution
      run: msbuild TeknoParrotUI.sln /p:Configuration=Release /m

    - name: Find all output files
      shell: cmd
      run: |
        echo ===== Mencari file .exe =====
        dir /s /b *.exe
        echo.
        echo ===== Mencari folder bin =====
        dir /s /b /ad bin

    - name: Create full_build and copy everything possible
      shell: cmd
      run: |
        mkdir full_build
        for /r %%i in (*.exe) do copy "%%i" full_build\ /Y
        for /r %%i in (*.dll) do copy "%%i" full_build\ /Y
        for /r %%i in (*.json) do copy "%%i" full_build\ /Y
        for /r %%i in (*.config) do copy "%%i" full_build\ /Y
        dir full_build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeknoParrotUI-Full-Build
        path: full_build/
        if-no-files-found: warn
